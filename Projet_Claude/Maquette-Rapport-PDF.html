<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette rapport PDF</title>
<style>
:root{
  --primary:#2563EB; --dark:#1F2937; --secondary:#4B5563; --gray:#6B7280; --line:#E5E7EB; --soft:#F3F4F6; --softer:#F9FAFB;
  --green:#10B981; --yellow:#F59E0B; --purple:#8B5CF6; --red:#EF4444; --pink:#DB2777;
  --green-t:#047857; --red-t:#B91C1C; --amber-t:#B45309; --blue-t:#1D4ED8;
  --green-bg:#D1FAE5; --red-bg:#FEE2E2; --amber-bg:#FEF3C7; --blue-bg:#DBEAFE; --pink-bg:#FCE7F3; --purple-bg:#EDE9FE;
  --bg:#E5E7EB; --paper:#fff; --ink:#1F2937;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Helvetica,Arial,"Segoe UI",sans-serif;font-size:14px;line-height:1.45}
/* ---------- barre et navigation de la maquette (hors PDF) ---------- */
.topbar{position:sticky;top:0;z-index:20;background:#111827;color:#fff;display:flex;gap:16px;align-items:center;padding:8px 18px;font-size:13px}
.topbar b{font-weight:700}
.topbar label{display:flex;gap:6px;align-items:center;cursor:pointer;margin-left:auto}
.topbar a{color:#BFDBFE;text-decoration:none}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:0;max-width:1480px;margin:0 auto}
nav.side{position:sticky;top:42px;align-self:start;height:calc(100vh - 42px);overflow:auto;padding:18px 12px 30px 18px;font-size:12.5px}
nav.side h4{margin:0 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gray)}
nav.side a{display:block;color:var(--secondary);text-decoration:none;padding:3px 0}
nav.side a:hover{color:var(--primary)}
nav.side .grp{margin-top:12px}
main{padding:22px 18px 80px}
.intro{max-width:1020px;margin:0 auto 36px;background:#fff;border-radius:12px;padding:28px 34px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.intro h1{margin:0 0 4px;font-size:26px}
.intro h2{margin:26px 0 8px;font-size:17px;color:var(--primary)}
.intro p,.intro li{font-size:14px;color:#374151}
.intro ul{padding-left:20px;margin:6px 0}
.intro table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
.intro th,.intro td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.intro th{background:var(--soft)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700}
.pill.new{background:var(--green-bg);color:var(--green-t)} .pill.rich{background:var(--blue-bg);color:var(--blue-t)} .pill.old{background:var(--soft);color:var(--secondary)}
.principles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.principles div{background:var(--softer);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}
.principles b{display:block;margin-bottom:2px;color:var(--dark)}
/* ---------- feuille = page + note ---------- */
.sheet{display:grid;grid-template-columns:210mm 250px;gap:22px;justify-content:center;margin:0 auto 34px;align-items:start}
body.hide-notes .sheet{grid-template-columns:210mm}
body.hide-notes .note{display:none}
.note{background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:12px 14px;font-size:12.5px;color:#78350F;position:sticky;top:56px}
.note h5{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.note p{margin:4px 0}
.note .pill{margin-bottom:6px}
@media (max-width:1250px){.sheet{grid-template-columns:210mm}.note{position:static}}
/* ---------- LA PAGE A4 ---------- */
.page{width:210mm;height:297mm;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:9.4pt;line-height:1.4;color:var(--dark)}
.phead{position:absolute;left:14mm;right:14mm;top:0;height:35mm;border-bottom:.35mm solid var(--primary)}
.phead .co{position:absolute;left:0;top:11mm;font-size:19pt;font-weight:700;line-height:1}
.phead .sub{position:absolute;left:0;top:21mm;font-size:10.5pt;color:var(--gray)}
.phead .sub b{color:var(--primary);font-weight:700}
.phead img{position:absolute;right:0;top:9mm;height:21mm}
.pfoot{position:absolute;left:14mm;right:14mm;bottom:5.5mm;display:flex;justify-content:space-between;font-size:7pt;color:var(--gray)}
.pbody.dense{--pad:1.1mm}
.pbody{position:absolute;left:14mm;right:14mm;top:40mm;bottom:14mm;overflow:hidden}
.pbody.full{top:0;left:0;right:0;bottom:0}
/* bandeau de chapitre */
.chap{background:var(--primary);color:#fff;border-radius:2mm;padding:3.4mm 5mm;display:flex;gap:5mm;align-items:center;margin-bottom:3.5mm}
.chap .num{font-size:30pt;font-weight:700;line-height:1;opacity:.95;min-width:11mm}
.chap .t{font-size:14pt;font-weight:700;line-height:1.15}
.chap .q{font-size:8.6pt;opacity:.92;margin-top:1mm}
.chap.cont{padding:2mm 5mm}.chap.cont .num{font-size:15pt}.chap.cont .t{font-size:11pt}
h3.s{font-size:11pt;color:var(--primary);margin:3.5mm 0 1.8mm;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
h3.s small{font-size:7.5pt;color:var(--gray);font-weight:400}
.verdict{border-left:1.4mm solid var(--amber-t);background:var(--amber-bg);border-radius:0 2mm 2mm 0;padding:2.6mm 4mm;margin-bottom:3mm}
.verdict b.big{font-size:11.5pt;display:block;margin-bottom:.6mm}
.retain{border:.3mm solid var(--primary);border-radius:2mm;padding:2.4mm 4mm;background:#EFF6FF;margin-top:3mm}
.retain h6{margin:0 0 1mm;font-size:8pt;color:var(--blue-t);text-transform:uppercase;letter-spacing:.05em}
.retain ul{margin:0;padding-left:4mm}.retain li{margin:.3mm 0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4mm}
.tile{background:var(--softer);border:.25mm solid var(--line);border-radius:2mm;padding:2.4mm 3mm;display:flex;flex-direction:column;justify-content:space-between;min-height:21mm}
.tile .l{font-size:7.6pt;color:var(--secondary)}
.tile .v{font-size:17pt;font-weight:700;line-height:1.1;margin-top:1mm}
.tile .c{font-size:7.2pt;margin-top:.8mm}
.ok{color:var(--green-t)}.bad{color:var(--red-t)}.warn{color:var(--amber-t)}.mut{color:var(--gray)}
table.tb{width:100%;border-collapse:collapse;font-size:8.3pt}
table.tb th{background:var(--secondary);color:#fff;font-weight:700;text-align:right;padding:1.3mm 1.8mm}
table.tb th:first-child,table.tb td:first-child{text-align:left}
table.tb td{padding:var(--pad,1.7mm) 1.8mm;border-bottom:.2mm solid var(--line);text-align:right}
table.tb tr:nth-child(even) td{background:var(--softer)}
table.tb tfoot td{font-weight:700;background:var(--soft)!important;border-top:.3mm solid var(--secondary)}
table.tb.green th{background:var(--green)} table.tb.yellow th{background:var(--yellow);color:var(--dark)} table.tb.pink th{background:var(--pink)} table.tb.blue th{background:var(--primary)}
table.tb td.l{text-align:left}
.heat{font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
.card{border:.25mm solid var(--line);border-radius:2mm;padding:2.6mm 3.2mm;background:#fff}
.card h4{margin:0 0 1.4mm;font-size:8.6pt}
.fcol{border-left:1mm solid;border-radius:0 1.6mm 1.6mm 0;padding:2mm 3mm}
.fcol.f{background:#ECFDF5;border-color:var(--green)} .fcol.w{background:#FEF2F2;border-color:var(--red)}
.fcol h5{margin:0 0 1mm;font-size:8.2pt}.fcol.f h5{color:var(--green-t)}.fcol.w h5{color:var(--red-t)}
.fcol ul{list-style:none;margin:0;padding:0}.fcol li{margin:0 0 1.4mm;font-size:8.2pt;line-height:1.3}
.fcol li b{display:block;font-size:7.9pt}.fcol li span{color:var(--secondary)} .fcol li i{color:var(--gray);font-style:normal;font-size:7pt}
.grpt{font-size:8.4pt;font-weight:700;color:var(--secondary);margin:2mm 0 1mm}
.hb{display:grid;grid-template-columns:50mm 1fr 20mm;gap:2mm;align-items:center;font-size:8.3pt;margin:.9mm 0}
.hb .tr{background:var(--soft);border-radius:.8mm;height:4.2mm;position:relative}
.hb .fi{position:absolute;left:0;top:0;bottom:0;border-radius:0 1mm 1mm 0}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .vl{text-align:right;font-weight:700}
.stack{display:flex;height:7mm;border-radius:1.4mm;overflow:hidden;gap:.5mm}
.stack div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:7pt;font-weight:700;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:1mm 4mm;font-size:7.3pt;color:var(--secondary);margin-top:1.4mm}
.legend i{display:inline-block;width:2.6mm;height:2.6mm;border-radius:.5mm;margin-right:1.2mm;vertical-align:-.4mm}
.mx{display:grid;grid-template-columns:7mm 1fr 1fr;grid-template-rows:auto 1fr 1fr 6mm;gap:1.6mm;height:108mm}
.mx .q{border-radius:2mm;padding:2.4mm 3mm;border:.3mm solid}
.mx .q h4{margin:0;font-size:9.5pt}.mx .q small{display:block;font-size:7.2pt;color:var(--secondary);margin:.4mm 0 1.2mm}
.mx .q ul{margin:0;padding-left:3.6mm;font-size:7.7pt}
.mx .ax{font-size:7.2pt;color:var(--gray);display:flex;align-items:center;justify-content:center}
.mx .axy{writing-mode:vertical-rl;transform:rotate(180deg)}
.q.star{background:#DBEFFF;border-color:#93C5FD}.q.que{background:#FEF3E2;border-color:#FDE047}.q.cow{background:#F3F4F6;border-color:#D1D5DB}.q.dog{background:#FEE2E2;border-color:#FCA5A5}
.mt{display:grid;grid-template-columns:34mm repeat(3,1fr);gap:1.2mm;font-size:7.6pt}
.mt .h{font-weight:700;color:var(--secondary);padding:1mm}.mt .c{border-radius:1.4mm;padding:1.4mm 2mm;text-align:center}
.mt .c small{display:block;font-weight:400;font-size:7pt}
.cover{display:flex;flex-direction:column;align-items:center}
.cover .frame{position:absolute;left:10mm;top:10mm;right:10mm;bottom:10mm;border:.5mm solid var(--gray)}
.src{font-size:6.8pt;color:var(--gray);margin-top:1.4mm}
.fiche-head{display:flex;justify-content:space-between;align-items:flex-start;gap:4mm;margin-bottom:2.6mm}
.badge{display:inline-block;padding:.6mm 2.4mm;border-radius:99px;font-size:7.6pt;font-weight:700}
.badge.cow{background:#E5E7EB;color:#374151}.badge.star{background:#DBEFFF;color:#1E40AF}.badge.que{background:#FEF3E2;color:#92400E}.badge.dog{background:#FEE2E2;color:#991B1B}
.toc{list-style:none;margin:0;padding:0}
.toc li{display:grid;grid-template-columns:9mm 1fr 10mm;gap:2mm;align-items:baseline;padding:2mm 0;border-bottom:.2mm dotted #9CA3AF}
.toc .n{font-size:16pt;font-weight:700;color:var(--primary)}
.toc .t{font-size:10.5pt;font-weight:700}.toc .q{font-size:7.8pt;color:var(--gray)}.toc .p{text-align:right;font-weight:700;color:var(--primary);font-size:10.5pt}
.toc .tab{display:inline-block;font-size:6.8pt;background:var(--soft);border-radius:1mm;padding:0 1.4mm;margin-left:1.4mm;color:var(--secondary)}
.ell{width:210mm;border:2px dashed #9CA3AF;border-radius:8px;padding:22px;text-align:center;color:#4B5563;background:#F9FAFB;font-size:14px}
svg text{font-family:Helvetica,Arial,sans-serif}
@media print{
  body{background:#fff}.topbar,nav.side,.note,.intro,.ell{display:none!important}.layout{display:block}main{padding:0}
  .sheet{display:block;margin:0;break-after:page}.page{box-shadow:none}@page{size:A4;margin:0}
}
.prov{margin:4px 0 0;padding:0;list-style:none}.prov li{margin:6px 0}.prov .pill{font-size:10px}
.cf{display:grid;grid-template-columns:1fr 1fr;gap:2mm}.cfi{border-left:1mm solid;border-radius:0 1.4mm 1.4mm 0;padding:1.6mm 2.6mm;font-size:7.8pt;line-height:1.3}.cfi b{display:block}.cfi span{color:var(--secondary)}
.cfi.f{background:#ECFDF5;border-color:#10B981}.cfi.w{background:#FEF2F2;border-color:#EF4444}.cfi.n{background:#F3F4F6;border-color:#9CA3AF}
.cmt{margin-top:4mm;border:.3mm dashed #9CA3AF;border-radius:2mm;padding:2.4mm 3.4mm;font-size:8pt;color:var(--secondary)}.cmt i{color:var(--gray);font-size:7.4pt}.cmt .ln{border-bottom:.2mm solid #D1D5DB;height:5mm}
.tiles4{display:grid;gap:2.4mm}
.pbody.dense .fcol li{font-size:7.3pt;margin-bottom:.9mm}.pbody.dense .fcol li b{font-size:7.5pt}
table.bs{width:100%;border-collapse:collapse;font-size:7.8pt;border:.25mm solid var(--line)}
table.bs thead th{background:#F3F4F6;text-align:right;padding:1.3mm 2mm;font-size:8pt}table.bs thead th:first-child{text-align:left;font-size:7.2pt;color:var(--gray)}
table.bs th.sec{background:#F3F4F6;text-align:left;font-style:italic;font-size:7pt;color:#6B7280;padding:1mm 2mm}
table.bs tbody th{text-align:left;font-weight:500;color:#4B5563;padding:.6mm 2mm;border-top:.2mm solid #F3F4F6}
table.bs td{text-align:right;padding:.6mm 2mm;border-top:.2mm solid #F3F4F6;color:#4B5563}
table.bs td.b{font-weight:700}table.bs td.ind{color:#4338CA}
table.bs tr.emph th,table.bs tr.emph td{background:#EEF2FF}
.rc{border:.25mm solid var(--line);border-radius:2mm;padding:2mm 2.6mm;margin-bottom:2.2mm}.rch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1.2mm;font-size:8pt}.rcg{display:grid;grid-template-columns:1.2fr 1fr 1.1fr;gap:2.4mm}.rcg td:not(.l){white-space:nowrap}.pbody.dense .fiche-head{margin-bottom:1.4mm}.pbody.dense h3.s{margin:2.6mm 0 1.4mm}
/* marque : touche de vert (couleur des marges de l'application et du logo) */
:root{--brand-green:#16A34A}
.toc .n{color:var(--brand-green)}
.phead::after{content:"";position:absolute;left:0;bottom:-.35mm;width:34mm;height:.9mm;background:var(--brand-green)}
.page.std::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3.2mm;background:linear-gradient(90deg,var(--primary) 0 72%,var(--brand-green) 72% 100%)}
/* mise en page */
.page.mw{position:absolute;left:-99999px;top:0;height:auto;overflow:visible;box-shadow:none}
.pbody.measure{position:static;display:flow-root;width:182mm;margin-left:14mm;height:auto;overflow:visible}
.idx{display:grid;grid-template-columns:1fr 1fr;gap:0 7mm}.idx div{display:flex;justify-content:space-between;gap:3mm;border-bottom:.2mm dotted #9CA3AF;padding:1.1mm 0;font-size:8pt}.idx b{color:var(--primary)}
.fiche-head.nx{border-top:0;padding-top:0;margin-top:0}
.note{max-height:calc(100vh - 70px);overflow:auto}.note hr{border:0;border-top:1px solid #FDE68A;margin:10px 0}
</style>
</head>

{"term":"Allergène","def":"L'une des 14 substances de déclaration courante (gluten, lait, arachides…). Se coche sur chaque ingrédient ; la recette affiche la liste de ceux qu'elle contient."},{"term":"Amplitude","def":"L'écart entre le prix le plus haut et le plus bas d'un ingrédient, divisé par son prix moyen. Mesure à quel point un prix bouge."},{"term":"Analyse ABC","def":"Classement des ingrédients (ou des emballages) par importance financière, selon le principe de Pareto : A jusqu'à 70 % du coût cumulé, B jusqu'à 90 %, C le reste."},{"term":"Bassin (« pool »)","def":"Un ensemble de frais fixes destiné à être réparti : bassin Général, bassin d'une activité ou bassin d'un canal."},{"term":"Bénéfice brut / bénéfice net (État des résultats)","def":"Bénéfice brut : revenus moins charges directes réelles. Bénéfice net : bénéfice brut moins frais fixes. À distinguer de la marge brute et de la marge nette d'un produit, calculées par unité."},{"term":"Canal de vente","def":"La chaîne d'intermédiaires entre votre entreprise et le consommateur (vente directe, distributeur, détaillant…)."},{"term":"Capacité de production","def":"Ce que votre équipe peut produire pendant la période, mesuré en heures productives."},{"term":"Charge de travail","def":"Les heures de main-d'œuvre que chaque activité consomme, d'après vos recettes et vos ventes. Montre où part le temps de l'équipe."},{"term":"Charge directe","def":"Un coût qu'on rattache à un produit précis : matières, emballage, main-d'œuvre de production, sous-traitance."},{"term":"Charge financière","def":"Le coût de l'argent immobilisé ; dans l'application, le vieillissement d'un produit qui doit mûrir avant d'être vendu."},{"term":"Charge indirecte","def":"Un coût qu'on ne peut pas rattacher à un produit précis et qu'on répartit entre les produits : synonyme de frais fixes dans l'application."},{"term":"CICI","def":"Coefficient d'imputation des charges indirectes : la règle qui répartit le bassin de frais fixes d'une activité entre ses produits (au prorata des coûts directs, du temps de production ou du volume physique)."},{"term":"Clé de répartition","def":"La façon de ventiler un frais fixe entre Général, activités et canaux : manuelle, selon les ventes, selon les charges directes, un élément précis ou une clé personnalisée."},{"term":"Constat clé","def":"Une force ou une faiblesse de votre entreprise, calculée par une règle fixe à partir de vos chiffres, avec un lien vers l'endroit où agir. Affichée dans la Vue d'ensemble de Rapport et suivi."},{"term":"Contribution totale","def":"Marge brute par unité multipliée par les unités vendues : l'argent qu'un produit apporte pour payer les frais fixes."},{"term":"Coût d'achat requis","def":"Le coût net d'un ingrédient plus le coût de ses pertes en stock : ce qu'il faut réellement acheter et budgéter."},{"term":"Coût de portage","def":"L'intérêt sur l'argent immobilisé dans un stock qui doit mûrir. Voir vieillissement."},{"term":"Coût de production","def":"La somme des coûts directs d'une unité : matière, emballage, main-d'œuvre et sous-traitance, avant les frais fixes."},{"term":"Coût de revient (complet)","def":"Tout ce qu'il en coûte pour fabriquer et vendre une unité : les coûts directs plus la part des frais fixes (et du vieillissement, s'il y a lieu)."},{"term":"Coût fixe","def":"Un coût qui ne change pas avec le volume produit, pour la période considérée (loyer, assurances)."},{"term":"Coût horaire chargé","def":"Le coût réel d'une heure de travail pour l'employeur : salaire × (1 + charges) × (1 + vacances)."},{"term":"Coût matière","def":"Le coût des ingrédients d'un produit, souvent exprimé en pourcentage de son prix de vente : la part du prix qui sert à acheter la matière."},{"term":"Coût réel d'une heure productive","def":"La paie totale de l'équipe divisée par les heures réellement utilisées à produire. Plus élevé que le taux horaire moyen chargé quand des heures sont payées sans servir. Affiché dans Rapport et suivi → Main-d'œuvre."},{"term":"Coût variable","def":"Un coût qui augmente avec le volume produit (matières, emballage)."},{"term":"Dépendance (fournisseur)","def":"Un fournisseur qui pèse 30 % ou plus de vos achats : s'il fait défaut ou augmente ses prix, une grande part de vos achats est touchée. Signalée par une barre orange dans Rapport et suivi → Ingrédients ou Emballages."},{"term":"Économie d'échelle","def":"La baisse du coût par unité quand le volume augmente, parce que les frais fixes se répartissent sur plus d'unités."},{"term":"Format","def":"L'emballage et la quantité sous lesquels un produit est vendu (ex. 340 g, 900 g). Chaque format a sa propre recette, son prix et sa part des ventes."},{"term":"Format d'achat","def":"La quantité contenue dans l'unité que vous achetez (ex. 25 kg par sac)."},{"term":"Frais de structure","def":"Les frais fixes qui servent à toute l'entreprise et qu'on ne peut attribuer à aucune activité ni à aucun canal (salaire de direction, assurance générale). Ils sont saisis dans la colonne « Général »."},{"term":"Frais fixes","def":"Les dépenses de l'entreprise qui ne sont pas liées à un produit précis et qui ne varient pas avec le volume : loyer, électricité, assurances, administration, marketing."},{"term":"Grille de rendement","def":"Un calcul de la quantité produite à partir d'une quantité de départ, d'étapes de transformation (pertes ou gains en %) et d'un taux de rejet."},{"term":"Intensité de main-d'œuvre","def":"Le temps de personnel divisé par la durée du processus. Au-dessus de 1, plusieurs personnes travaillent en même temps."},{"term":"Lot","def":"Une production d'un seul tenant. Dans l'application, une recette est saisie pour un lot."},{"term":"Maillon","def":"Un intermédiaire d'un canal de vente (distributeur, grossiste, détaillant) qui applique une marge ou une majoration."},{"term":"Majoration","def":"Le profit exprimé en pourcentage du coût (profit ÷ coût), contrairement à la marge, calculée sur le prix de vente."},{"term":"Marge brute","def":"Prix de vente moins les coûts directs (matière, emballage, main-d'œuvre, sous-traitance). En % : part du prix de vente."},{"term":"Marge de contribution","def":"Prix de vente moins le coût matière seul. En % : part du prix de vente."},{"term":"Marge de croissance","def":"Estimation de ce que les heures productives libres des postes de production pourraient produire de plus sans embauche, au même mix de produits. Indicative : elle suppose une demande suffisante."},{"term":"Marge de sécurité","def":"De combien les ventes prévues peuvent baisser avant d'atteindre le point mort : (ventes prévues − point mort) ÷ ventes prévues. Négative, elle signifie que les ventes prévues sont déjà sous le point mort."},{"term":"Marge nette","def":"Prix de vente moins le coût de revient complet. C'est le profit réel par unité. En % : part du prix de vente."},{"term":"Marge ou majoration ?","def":"Une marge est un pourcentage du prix de vente (profit ÷ prix) ; une majoration est un pourcentage du coût (profit ÷ coût). Pour le même profit, la majoration est plus élevée : un produit coûtant 1,20 $ vendu 1,50 $ a 20 % de marge et 25 % de majoration."},{"term":"Masse salariale","def":"La paie totale chargée de l'équipe : salaires, charges sociales et vacances. Rapport et suivi → Main-d'œuvre en montre l'utilisation."},{"term":"Matrice stratégique (matrice BCG)","def":"Méthode qui classe les produits en étoiles, vaches à lait, dilemmes et poids morts selon leur popularité et leur rentabilité."},{"term":"Moyenne pondérée","def":"Une moyenne où chaque élément compte selon son poids. Dans l'application, les moyennes des produits actifs sont pondérées par le revenu de chaque produit."},{"term":"Paie non utilisée","def":"La paie versée pour des heures qui ne servent pas à produire : le temps non productif prévu et la capacité productive inutilisée. Elle est absorbée dans le coût de revient des produits."},{"term":"Palier de volatilité","def":"La classe de volatilité d'un prix : faible (amplitude sous 10 %), modéré (10 % à moins de 20 %) ou élevé (20 % et plus)."},{"term":"Part des ventes","def":"La part de chaque produit (ou format) dans les ventes, en pourcentage. La somme des produits actifs devrait être de 100 %."},{"term":"PDS (prix de détail suggéré)","def":"Le prix proposé au consommateur final. Sert à calculer le prix net de chaque canal."},{"term":"Perte stock","def":"Quantité à acheter en plus pour compenser ce qui se perd en stock avant utilisation (péremption, casse, déclassement), selon le taux de perte du catalogue. Elle est prévue, pas mesurée."},{"term":"Point de référence","def":"Une « photo » de votre projet à une date donnée, à laquelle on compare l'évolution plus tard."},{"term":"Point mort (seuil de rentabilité)","def":"Le volume de ventes à partir duquel l'entreprise ne perd plus d'argent : frais fixes ÷ marge de contribution unitaire. Dans l'application, la main-d'œuvre de production est comptée parmi les coûts fixes."},{"term":"Popularité","def":"La part d'un produit dans les ventes. Dans la matrice, un produit est populaire s'il atteint 70 % de la part moyenne."},{"term":"Prix efficace","def":"Le prix unitaire corrigé du taux de perte en stock : prix unitaire ÷ (1 − perte). Ce que coûte vraiment un kilo utilisable."},{"term":"Prix net","def":"Ce qui revient au producteur par unité dans un canal donné, une fois les maillons payés."},{"term":"Prix unitaire","def":"Le prix d'achat ramené à l'unité de base : prix d'achat ÷ format d'achat."},{"term":"Produit de revente","def":"Un format acheté et revendu tel quel, sans transformation. Sa fiche se réduit à un coût d'achat."},{"term":"Produit, format, SKU","def":"Le produit est la recette ; le format, sa version vendue (taille et emballage) ; le SKU, la référence de ce format."},{"term":"Quantité produite","def":"Le nombre d'unités que la recette complète (le lot) permet de produire."},{"term":"Réconciliation","def":"La comparaison, à l'échelle de l'entreprise, du réel (comptabilité) et du théorique (modèle de recettes)."},{"term":"Réel","def":"Les chiffres de votre comptabilité pour la période, saisis dans l'État des résultats."},{"term":"Rendement","def":"La part d'un ingrédient qui reste après la transformation (épluchage, parage, cuisson). Un rendement de 80 % exige d'acheter 25 % de plus."},{"term":"SKU","def":"Stock keeping unit : le numéro de référence d'un format, déduit du produit et du format, modifiable."},{"term":"Sous-recette","def":"Une recette de base (sauce, bouillon, garniture) utilisée comme ingrédient dans d'autres recettes. N'apporte que son coût direct."},{"term":"Sous-traitance","def":"Une opération de fabrication confiée à un tiers. C'est une charge directe."},{"term":"Taux d'utilisation","def":"Les heures de production réellement nécessaires divisées par les heures productives payées. Un taux bas signale de la capacité inutilisée."},{"term":"Taux de perte","def":"La part d'un ingrédient ou d'un emballage qui se perd avant la production (péremption, casse, déclassement)."},{"term":"Taux de rejet","def":"La part des produits finis retirés après la production (contrôle qualité). Distinct d'une perte de procédé."},{"term":"Temps productif (%)","def":"La part des heures travaillées qu'un employé est censé consacrer à la production."},{"term":"Tendance","def":"La variation d'un prix entre son premier et son dernier relevé."},{"term":"Théorique","def":"Les chiffres que prévoit le modèle de recettes, à partir de vos fiches, prix et volumes."},{"term":"Vieillissement","def":"Le coût de portage d'un produit qui doit mûrir avant d'être vendu : charges directes × taux annuel ÷ 12 × durée en mois. Réduit la marge nette, pas la marge brute."},{"term":"Volatilité","def":"À quel point le prix d'un ingrédient ou d'un emballage varie d'un relevé à l'autre."},{"term":"Volume","def":"Le nombre d'unités vendues dans un canal pendant la période de référence."}]};

function initMeasure() {

const isKn = (n) => n.dataset && n.dataset.kn === '1';
function prep(nodes) {

    if (n.matches('h3.s, .grpt, .fiche-head, .nmark, .stack')) n.dataset.kn = '1';

const clip = (el) => el.cloneNode(true);
function contHeads(pre) {
  const out = [];
  pre.forEach(n => {
    if (n.matches('h3.s')) { const c = clip(n); c.querySelectorAll('small').forEach(s => s.remove()); c.querySelectorAll('span.mut').forEach(s => { if (/suite/.test(s.textContent)) s.remove(); }); c.insertAdjacentHTML('beforeend', ' <span class="mut" style="font-weight:400">(suite)</span>'); c.dataset.kn = '1'; out.push(c); }
    else if (n.matches('.grpt')) { const c = clip(n); c.querySelectorAll('span.mut').forEach(s => { if (/suite/.test(s.textContent)) s.remove(); }); c.insertAdjacentHTML('beforeend', ' <span class="mut" style="font-weight:400">(suite)</span>'); c.dataset.kn = '1'; out.push(c); }
  });
  return out;
}
const isTable = (n) => n.tagName === 'TABLE' && n.tBodies.length;
const isCf = (n) => n.classList && n.classList.contains('cf');
const isCols = (n) => n.classList && n.classList.contains('two') && n.querySelector(':scope > .fcol');
const splittable = (n) => (isTable(n) && n.tBodies[0].rows.length > 2) || (isCf(n) && n.children.length > 2) || isCols(n);

function tableBuild(n, k) {
  const rows = [...n.tBodies[0].rows], a = clip(n), b = clip(n);
  a.tBodies[0].replaceChildren(...rows.slice(0, k).map(clip)); if (a.tFoot) a.tFoot.remove();
  b.tBodies[0].replaceChildren(...rows.slice(k).map(clip));
  return [a, b];
}
function colsBuild(n, ca, cb) {
  const cols = [...n.querySelectorAll(':scope > .fcol')], mk = (counts, from) => { const c = clip(n); [...c.querySelectorAll(':scope > .fcol')].forEach((col, i) => { const lis = [...cols[i].querySelectorAll('li')]; const ul = col.querySelector('ul'); const sel = from ? lis.slice(counts[i]) : lis.slice(0, counts[i]); ul.replaceChildren(...sel.map(clip)); }); return c; };
  const pcs2 = mk([ca, cb], false), rest = mk([ca, cb], true); [...rest.querySelectorAll(':scope > .fcol')].forEach(c => { if (!c.querySelector('li')) c.remove(); }); if (rest.querySelectorAll(':scope > .fcol').length === 1) rest.style.gridTemplateColumns = '1fr'; return [pcs2, rest];
}
function trySplit(pre, last) {
  pre.forEach(p => { MB.appendChild(clip(p)); });
  const undo = () => { for (let i = 0; i < pre.length; i++) MB.removeChild(MB.lastChild); };
  let best = null;
  const test = (piece) => { MB.appendChild(piece); const ok = fits(); MB.removeChild(piece); return ok; };
  if (isTable(last)) {
    const rows = [...last.tBodies[0].rows], bs = last.classList.contains('bs'), n = rows.length;
    for (let k = n - 1; k >= (bs ? 1 : 2); k--) {
      if (bs && !rows[k].querySelector('th.sec')) continue;
      const [a, b] = tableBuild(last, k); if (test(a)) { best = { piece: a, rest: b }; break; }
    }
  } else if (isCf(last)) {
    const items = [...last.children];
    for (let k = items.length - 1; k >= 2; k--) { const a = clip(last), b = clip(last); a.replaceChildren(...items.slice(0, k).map(clip)); b.replaceChildren(...items.slice(k).map(clip)); if (test(a)) { best = { piece: a, rest: b }; break; } }
  } else if (isCols(last)) {
    const cols = [...last.querySelectorAll(':scope > .fcol')], tot = cols.map(c => c.querySelectorAll('li').length);
    let ca = 0, cb = 0, okAny = false;
    while (ca < tot[0] || cb < tot[1]) {
      const [pa] = colsBuild(last, ca, cb); MB.appendChild(pa); const cs = [...pa.querySelectorAll(':scope > .fcol')].map(c => c.getBoundingClientRect().height); MB.removeChild(pa);
      const order = (cs[0] <= cs[1] ? [0, 1] : [1, 0]); let moved = false;
      for (const c of order) {
        if ((c === 0 ? ca : cb) >= tot[c]) continue;
        const na = ca + (c === 0 ? 1 : 0), nb = cb + (c === 1 ? 1 : 0), [p] = colsBuild(last, na, nb);
        if (test(p)) { ca = na; cb = nb; moved = true; break; }
      }
      if (!moved) break; okAny = true;
    }
    if (okAny && (ca < tot[0] || cb < tot[1]) && ca + cb > 0) { const [a, b] = colsBuild(last, ca, cb); best = { piece: a, rest: b }; }
  }
  undo();
  return best;
}
function paginateChapter(nodes, dense) {
  prep(nodes);
  MB.className = 'pbody measure' + (dense ? ' dense' : ''); MB.innerHTML = '';
  const pages = []; let cur = [], guard = 0; const Q = [...nodes];
  const append = (arr) => arr.forEach(n => { const c = clip(n); MB.appendChild(c); cur.push(c); });
  const drop = (k) => { for (let i = 0; i < k; i++) { MB.removeChild(MB.lastChild); cur.pop(); } };
  const newPage = () => { pages.push(cur); cur = []; MB.innerHTML = ''; };
  while (Q.length && guard++ < 6000) {
    let cnt = 0; while (cnt < Q.length - 1 && isKn(Q[cnt])) cnt++; cnt++; cnt = Math.min(cnt, Q.length);
    const group = Q.slice(0, cnt), last = group[group.length - 1], pre = group.slice(0, -1);
    if (group[0].dataset && group[0].dataset.pb === '1' && cur.length) { newPage(); continue; }
    append(group);
    if (fits()) { Q.splice(0, cnt); continue; }
    drop(group.length);
    if (splittable(last)) {
      const r = trySplit(pre, last);
      if (r) { append(pre); cur.push(r.piece); MB.appendChild(r.piece); Q.splice(0, cnt); Q.unshift(...contHeads(pre), r.rest); newPage(); continue; }
    }
    if (cur.length) { newPage(); continue; }
    append(group); Q.splice(0, cnt); newPage();
  }
  if (cur.length) pages.push(cur);
  return pages;
}

  /* ---------- Chapitre 7 : fiches ---------- */
  const prodFindings = (F) => {

function renderAll() {
  defineContent();
  const sheets = [], newMap = { seg: {}, chap: {}, total: 0 };
  let pageNo = 3; const DENSE = { 1: true, 7: true, A: true };
  const pagesOf = [];
  CHAPS.forEach(C => {
    const c = C.n, banner = chap(c, false), html = banner + (CH_SEGS[c] || []).join('');
    const tmp = document.createElement('div'); tmp.innerHTML = html;
    const pages = paginateChapter([...tmp.children], !!DENSE[c]);
    newMap.chap[c] = pageNo;
    pages.forEach(nodes => {
      const keys = nodes.flatMap(n => n.matches && n.matches('.nmark') ? [n.dataset.k] : [...(n.querySelectorAll ? n.querySelectorAll('.nmark') : [])].map(x => x.dataset.k));
      keys.forEach(k => { if (!(k in newMap.seg)) newMap.seg[k] = pageNo; });
      pagesOf.push({ n: pageNo, c, nodes, keys, dense: !!DENSE[c] });
      pageNo++;
    });
  });
  newMap.total = pageNo - 1;
  return { pagesOf, newMap };
}

<li><b>Un seul tableau de produits</b> (chapitre 3) : du PDS à la marge nette, avec la classe et le renvoi à la fiche.</li>
<li><b>Annexe D : seulement les termes du glossaire du guide qui figurent dans le rapport</b>, mot pour mot. La sélection est automatique et suit les chapitres inclus.</li>
<li><b>Commentaire de la direction</b> : imprimé seulement si l’entrepreneur l’a saisi à l’export. Sans commentaire, aucune case ni aucun espace n’est réservé (la synthèse n’en a donc pas ici ; le chapitre 2 montre un exemple saisi).</li></ul>

<h2>2. Sans IA : ce qui existe, ce qu’il faudrait développer</h2>
<p>Rien dans ce rapport n’est écrit par une IA. Voici l’état de chaque élément, pour que vous voyiez ce que l’application fait déjà et ce qui reste à construire, toujours avec des règles fixes :</p>
<table><tr><th>Élément</th><th>État</th></tr>
<tr><td>Tuiles, constats clés, matrices, tableaux, courbes, réconciliation, achats, ABC, main-d’œuvre, cascade par SKU</td><td><span class="pill rich">Existe</span> dans Rapport et suivi (le rapport les imprime)</td></tr>

<tr><td><b>Constats du produit</b> (en tête de chaque fiche)</td><td><span class="pill new">À développer</span> : les règles existantes (classe, produit déficitaire, coût matière au-dessus de la cible, bénéfice brut par heure, écart entre formats) appliquées à un seul format</td></tr>
<tr><td><b>« Ce que cela veut dire »</b> (4 blocs : réconciliation, évolution, activité × canal, main-d’œuvre)</td><td><span class="pill new">À développer</span> : phrases à gabarit avec un seuil (± 5 %), un sommet, un creux ; aucune cause affirmée en dehors de celles que l’application cite déjà</td></tr>
